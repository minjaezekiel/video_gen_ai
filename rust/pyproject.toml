[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "video-gen-core"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Optional native accelerator for video_gen_ai's per-frame hot loops"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ezekiel Minja" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/minjaezekiel/video_gen_ai"

[tool.maturin]
# abi3 means one wheel works across CPython 3.9+, so a user installs a binary
# rather than needing a Rust toolchain.
features = ["pyo3/extension-module"]
module-name = "video_gen_core"
