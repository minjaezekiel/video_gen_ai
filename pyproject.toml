[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-gen-ai"
dynamic = ["version"]
description = "Turn a prompt or a script into a narrated film with a cast, a shot list and a voice per character. Offline."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ezekiel Minja" }]
keywords = [
    "video", "video-generation", "text-to-video", "screenplay", "tts",
    "offline", "moviepy", "agent", "agent-skill", "narration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Exactly requirements.txt. The model stack is an extra, never a hard
# dependency: the whole pipeline runs without it.
dependencies = [
    "moviepy>=2.1",
    "imageio-ffmpeg>=0.5",
    "imageio>=2.34",
    "soundfile>=0.12",
    "numpy>=1.26,<3",
    "pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Stable Diffusion visuals, neural TTS and LLM enrichment. See
# requirements-ml.txt for the platform caveats -- notably that PyTorch
# publishes no macOS x86_64 wheel beyond Python 3.12.
ml = [
    "torch>=2.2",
    "transformers>=4.44",
    "diffusers>=0.31",
    "accelerate>=0.30",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
    "certifi>=2024.2.2",
]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/minjaezekiel/video_gen_ai"
Repository = "https://github.com/minjaezekiel/video_gen_ai"
Issues = "https://github.com/minjaezekiel/video_gen_ai/issues"

[project.scripts]
# Both names work: the short one for people, the explicit one for scripts and
# agent skills that would rather not guess.
video-gen = "video_gen.cli:main"
video_gen = "video_gen.cli:main"

[tool.setuptools]
# Listed rather than discovered: the repository root is itself importable, and
# auto-discovery would try to ship the test suite and the generated output
# directories as packages.
packages = ["video_gen", "video_gen.visuals", "video_gen.score"]

[tool.setuptools.dynamic]
version = { attr = "video_gen.__version__" }

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end renders (run with `pytest -m slow` or `pytest -m ''`)"]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*"]
